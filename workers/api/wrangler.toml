name = "evolve-ai-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
CLIENT_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "evolve-ai-db"
database_id = "local-d1-db"
migrations_dir = "migrations"
